<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>伊都国即売会レジ</title>
<style>
  :root{
    --paper:#FAF7EF; --card:#FFFFFF; --ink:#22302A; --sub:#6B7A70;
    --line:#E4DECF; --leaf:#2E6B3B; --leaf-d:#245730;
    --veg:#3B7A46; --fruit:#DD842A; --proc:#9C6B37;
    --total:#16211B; --accent:#E9B44C; --danger:#C0492F;
    --shadow:0 2px 0 rgba(34,48,42,.12);
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP","Meiryo",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none;}

  /* ---- ヘッダ ---- */
  header{
    display:flex; align-items:center; gap:16px;
    padding:10px 18px; background:var(--leaf); color:#fff;
    box-shadow:var(--shadow);
  }
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand .eb{font-size:11px; letter-spacing:.28em; opacity:.7; font-weight:700;}
  .brand h1{margin:0; font-size:20px; font-weight:800; letter-spacing:.04em;}
  .today{
    margin-left:auto; text-align:right; display:flex; align-items:baseline; gap:8px;
    background:rgba(0,0,0,.14); padding:6px 14px; border-radius:12px;
  }
  .today .lb{font-size:11px; opacity:.8; font-weight:700;}
  .today .amt{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .today .ct{font-size:11px; opacity:.75;}

  /* ---- レイアウト ---- */
  main{flex:1; display:grid; grid-template-columns:1fr 340px; min-height:0;}
  .left{display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line);}

  /* タブ */
  .tabs{display:flex; gap:8px; padding:12px 14px 4px;}
  .tab{
    flex:1; padding:12px 0; border-radius:12px; font-size:15px; font-weight:800;
    background:#fff; color:var(--sub); border:2px solid var(--line);
  }
  .tab[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .tab[data-cat="野菜"][aria-selected="true"]{background:var(--veg);border-color:var(--veg);}
  .tab[data-cat="果物"][aria-selected="true"]{background:var(--fruit);border-color:var(--fruit);}
  .tab[data-cat="加工品"][aria-selected="true"]{background:var(--proc);border-color:var(--proc);}

  /* 商品グリッド */
  .grid{
    flex:1; overflow-y:auto; padding:14px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:12px; align-content:start;
  }
  .pcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 10px 12px; text-align:left; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px; min-height:96px;
    transition:transform .05s;
  }
  .pcard:active{transform:translateY(2px); box-shadow:none;}
  .pcard .cat{
    font-size:10px; font-weight:800; letter-spacing:.08em;
    align-self:flex-start; padding:2px 8px; border-radius:999px; color:#fff;
  }
  .cat--野菜{background:var(--veg);} .cat--果物{background:var(--fruit);} .cat--加工品{background:var(--proc);}
  .pcard .nm{font-size:16px; font-weight:800; line-height:1.25; flex:1;}
  .pcard .pr{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums;}
  .pcard .pr small{font-size:12px; font-weight:700; opacity:.6;}

  /* ---- カート ---- */
  .cart{display:flex; flex-direction:column; min-height:0; background:#fff;}
  .cart h2{
    margin:0; padding:14px 16px 10px; font-size:14px; font-weight:800; letter-spacing:.1em;
    color:var(--sub); border-bottom:1px solid var(--line);
  }
  .items{flex:1; overflow-y:auto; padding:6px 10px;}
  .empty{color:var(--sub); text-align:center; padding:48px 20px; font-size:14px; line-height:1.8;}
  .empty b{display:block; font-size:15px; color:var(--ink); margin-bottom:6px;}
  .item{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center;
    padding:10px 6px; border-bottom:1px dashed var(--line);}
  .item .inm{font-size:15px; font-weight:700;}
  .item .isub{grid-column:1; font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .item .isum{grid-column:2; grid-row:1/3; font-size:17px; font-weight:800; text-align:right;
    font-variant-numeric:tabular-nums; align-self:center;}
  .qty{grid-column:2; display:flex; align-items:center; gap:0; align-self:start;}
  .qty button{width:32px; height:32px; border-radius:9px; font-size:20px; font-weight:800;
    background:var(--paper); color:var(--ink); border:1px solid var(--line); line-height:1;}
  .qty .n{min-width:34px; text-align:center; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
  .qty .del{color:var(--danger); font-size:15px;}

  .cart-foot{border-top:2px solid var(--ink); padding:12px 16px 16px; background:var(--paper);}
  .sumline{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .sumline .lb{font-size:14px; font-weight:800; color:var(--sub);}
  .sumline .tot{font-size:34px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--total);}
  .sumline .tot small{font-size:16px; margin-right:2px;}
  .pay{width:100%; padding:18px 0; border-radius:14px; font-size:20px; font-weight:900;
    background:var(--leaf); color:#fff; letter-spacing:.1em; box-shadow:var(--shadow);}
  .pay:disabled{background:#C8C8BE; box-shadow:none;}
  .clear{width:100%; margin-top:8px; padding:10px 0; border-radius:10px; font-size:13px; font-weight:700;
    background:transparent; color:var(--danger); border:1px solid var(--line);}

  /* ---- 会計オーバーレイ ---- */
  .overlay{position:fixed; inset:0; background:rgba(22,33,27,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.on{display:flex;}
  .sheet{width:100%; max-width:460px; background:var(--paper); border-radius:20px 20px 0 0;
    padding:18px 18px 24px; box-shadow:0 -6px 30px rgba(0,0,0,.25);}
  .sheet .grab{width:44px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 14px;}
  .payrow{display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px;}
  .payrow .lb{font-size:15px; font-weight:800; color:var(--sub);}
  .payrow .v{font-size:26px; font-weight:900; font-variant-numeric:tabular-nums;}
  .payrow.total .v{color:var(--total);}
  .payrow.recv .v{color:var(--leaf-d);}
  .payrow.change{border-top:2px solid var(--ink); margin-top:6px; padding-top:12px;}
  .payrow.change .lb{font-size:17px; color:var(--ink);}
  .payrow.change .v{font-size:36px; color:var(--fruit);}
  .payrow.change.neg .v{color:var(--danger);}
  .quick{display:flex; gap:8px; margin:14px 0 8px;}
  .quick button{flex:1; padding:14px 0; border-radius:12px; font-size:15px; font-weight:800;
    background:#fff; border:2px solid var(--line); color:var(--ink);}
  .quick .exact{background:var(--accent); border-color:var(--accent);}
  .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .keys button{padding:16px 0; border-radius:12px; font-size:22px; font-weight:800;
    background:#fff; border:1px solid var(--line); color:var(--ink); font-variant-numeric:tabular-nums;}
  .keys .util{background:var(--paper); font-size:16px;}
  .confirm{width:100%; margin-top:12px; padding:18px 0; border-radius:14px; font-size:20px; font-weight:900;
    background:var(--leaf); color:#fff; letter-spacing:.08em;}
  .confirm:disabled{background:#C8C8BE;}
  .cancel{width:100%; margin-top:8px; padding:10px 0; background:transparent; color:var(--sub);
    font-size:14px; font-weight:700;}

  /* トースト・状態 */
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:14px 22px; border-radius:14px; font-weight:800;
    font-size:16px; opacity:0; pointer-events:none; transition:.25s; z-index:60; text-align:center; line-height:1.5;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .big{font-size:26px; font-weight:900; color:var(--accent);}
  .banner{padding:12px 18px; background:#FBE5DF; color:var(--danger); font-size:13px; font-weight:700;
    text-align:center; display:none;}
  .banner.on{display:block;}

  /* ---- 在庫バッジ ---- */
  .pcard{position:relative;}
  .pcard .stk{display:block; margin-top:4px; font-size:12px; font-weight:800;
    color:var(--sub); font-variant-numeric:tabular-nums;}
  .pcard .stk.low{color:var(--danger);}
  .pcard.sold{opacity:.5;}
  .pcard .soldb{position:absolute; top:8px; right:8px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:900; padding:3px 9px; border-radius:99px; letter-spacing:.05em;}

  /* ---- 返品モード ---- */
  .modebtn{background:#fff; color:var(--leaf-d); border:2px solid #fff; border-radius:10px;
    padding:8px 16px; font-weight:800; font-size:14px; line-height:1;}
  .modebtn:active{transform:translateY(1px);}
  body.ret .modebtn{background:var(--danger); color:#fff; border-color:#fff;}
  body.ret header{background:var(--danger);}
  .retband{display:none;}
  body.ret .retband{display:block; background:#8f2f1f; color:#fff; text-align:center;
    font-weight:800; padding:7px; font-size:13px; letter-spacing:.14em;}
  body.ret .pay{background:var(--danger);}

  /* ---- 割引 ---- */
  .discbtns{display:flex; gap:8px; margin:4px 0 8px;}
  .discbtns button{flex:1; padding:12px 0; border-radius:11px; font-size:14px; font-weight:800;
    background:#fff; border:2px solid var(--line); color:var(--ink);}
  .discbtns button.on{background:var(--proc); border-color:var(--proc); color:#fff;}
  .payrow.sub .lb, .payrow.sub .v{color:var(--sub);}
  .payrow.sub .v{font-size:22px;}
  .payrow.disc .v{color:var(--danger);}
  .payrow.refundrow .v{font-size:40px; color:var(--danger);}
  body.ret .confirm{background:var(--danger);}
  /* 返品モードでは会計用UIを隠す */
  .payrow.refundrow{display:none;}
  body.ret .payrow.refundrow{display:flex;}
  body.ret .payrow.sub, body.ret .payrow.disc, body.ret .discbtns,
  body.ret .payrow.total, body.ret .payrow.recv, body.ret .payrow.change,
  body.ret .quick, body.ret .keys{display:none;}

  /* スマホ */
  @media(max-width:760px){
    main{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    .left{border-right:none;}
    .cart{border-top:2px solid var(--ink); max-height:44dvh;}
    .today .amt{font-size:18px;}
    .brand h1{font-size:17px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eb">FARM PARK ITOKOKU</span>
    <h1>伊都国即売会</h1>
  </div>
  <div class="today">
    <span class="lb">本日の売上</span>
    <span class="amt" id="todayAmt">¥—</span>
    <span class="ct" id="todayCt"></span>
  </div>
  <button class="modebtn" id="modeBtn">返品</button>
</header>

<div class="retband">● 返品モード ─ 商品をタップして返品分を選び、「返品する」で確定します</div>
<div class="banner" id="banner"></div>

<main>
  <section class="left">
    <div class="tabs" id="tabs">
      <button class="tab" data-cat="すべて" aria-selected="true">すべて</button>
      <button class="tab" data-cat="野菜">野菜</button>
      <button class="tab" data-cat="果物">果物</button>
      <button class="tab" data-cat="加工品">加工品</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart">
    <h2 id="cartTitle">カート</h2>
    <div class="items" id="items">
      <div class="empty"><b>商品をタップしてください</b>選ぶとここに入ります</div>
    </div>
    <div class="cart-foot">
      <div class="sumline">
        <span class="lb">合計</span>
        <span class="tot" id="cartTotal"><small>¥</small>0</span>
      </div>
      <button class="pay" id="payBtn" disabled>会計する</button>
      <button class="clear" id="clearBtn" style="display:none">カートを空にする</button>
    </div>
  </aside>
</main>

<!-- 会計オーバーレイ -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="grab"></div>
    <div class="payrow refundrow"><span class="lb">返金額</span><span class="v" id="ovRefund">¥0</span></div>
    <div class="payrow sub"><span class="lb">小計</span><span class="v" id="ovSub">¥0</span></div>
    <div class="payrow disc"><span class="lb">値引き</span><span class="v" id="ovDisc">−¥0</span></div>
    <div class="discbtns">
      <button data-disc="0" class="on">値引なし</button>
      <button data-disc="50">¥50引</button>
      <button data-disc="100">¥100引</button>
      <button data-disc="round">キリよく</button>
    </div>
    <div class="payrow total"><span class="lb">合計</span><span class="v" id="ovTotal">¥0</span></div>
    <div class="payrow recv"><span class="lb">預り金</span><span class="v" id="ovRecv">¥0</span></div>
    <div class="payrow change" id="ovChangeRow"><span class="lb">お釣り</span><span class="v" id="ovChange">¥0</span></div>

    <div class="quick">
      <button class="exact" data-exact="1">ちょうど</button>
      <button data-add="1000">¥1000</button>
      <button data-add="5000">¥5000</button>
    </div>
    <div class="keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="util" data-k="00">00</button><button data-k="0">0</button>
      <button class="util" data-k="back">←</button>
    </div>
    <button class="confirm" id="confirmBtn">会計を確定</button>
    <button class="cancel" id="cancelBtn">もどる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定：デプロイした GAS の /exec URL を貼ってください ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzyyC1uO1KMSwuYui11FBT_ilMaFTQ-zs-Fb0k37YXQ63Ftk6FJJjLsqKCv3VV911eIiQ/exec';

/* ===== 通信（JSONP） ===== */
function jsonp(action, params){
  return new Promise(function(resolve,reject){
    if(!GAS_URL || GAS_URL.indexOf('/exec')===-1){
      reject(new Error('GAS_URL が未設定です')); return;
    }
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const s=document.createElement('script');
    const q=new URLSearchParams(Object.assign({action:action,callback:cb},params||{}));
    const timer=setTimeout(function(){cleanup();reject(new Error('通信タイムアウト'));},30000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}
    window[cb]=function(data){cleanup();resolve(data);};
    s.onerror=function(){cleanup();reject(new Error('通信に失敗しました'));};
    s.src=GAS_URL+'?'+q.toString();
    document.body.appendChild(s);
  });
}

/* ===== 状態 ===== */
let PRODUCTS=[];               // {id,name,category,price,stock}
let cart={};                   // id -> qty（会計 or 返品の作業カート）
let curCat='すべて';
let received=0;                // 会計中の預り金
let discount=0;                // 会計中の値引き（円）
let RETURN=false;              // 返品モード
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const prod=id=>PRODUCTS.find(x=>x.id===id);
// 在庫追跡商品のこれ以上追加できる残数（無制限は Infinity）
function availOf(id){const p=prod(id); if(!p||p.stock==null)return Infinity; return Math.max(0,p.stock-(cart[id]||0));}

/* ===== 起動 ===== */
init();
async function init(){
  try{
    const res=await jsonp('getProducts');
    if(!res.ok) throw new Error(res.error||'商品取得に失敗');
    PRODUCTS=res.products;
    renderGrid();
    refreshSummary();
  }catch(e){
    showBanner(e.message+'（index.html の GAS_URL を確認してください）');
  }
}

/* ===== 商品グリッド ===== */
function renderGrid(){
  const grid=document.getElementById('grid');
  const list=PRODUCTS.filter(p=>curCat==='すべて'||p.category===curCat);
  grid.innerHTML='';
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">販売中の商品がありません</div>';return;}
  list.forEach(function(p){
    const b=document.createElement('button');
    b.className='pcard';
    const soldout=(p.stock!=null && p.stock<=0);
    if(soldout && !RETURN) b.classList.add('sold');
    let stkHtml='';
    if(p.stock!=null){
      stkHtml=soldout
        ? '<span class="stk low">在庫 0</span>'
        : '<span class="stk'+(p.stock<=3?' low':'')+'">残り '+p.stock+'</span>';
    }
    b.innerHTML='<span class="cat cat--'+p.category+'">'+p.category+'</span>'
      +(soldout && !RETURN?'<span class="soldb">売切</span>':'')
      +'<span class="nm">'+esc(p.name)+'</span>'
      +'<span class="pr"><small>¥</small>'+Number(p.price).toLocaleString('ja-JP')+'</span>'
      +stkHtml;
    if(soldout && !RETURN){ b.disabled=true; }
    else{ b.onclick=function(){addToCart(p.id);}; }
    grid.appendChild(b);
  });
}

document.getElementById('tabs').addEventListener('click',function(e){
  const t=e.target.closest('.tab'); if(!t)return;
  [].forEach.call(this.querySelectorAll('.tab'),x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true');
  curCat=t.dataset.cat; renderGrid();
});

/* ===== 返品モード切替 ===== */
document.getElementById('modeBtn').onclick=function(){
  RETURN=!RETURN;
  document.body.classList.toggle('ret',RETURN);
  this.textContent=RETURN?'返品中':'返品';
  clearCart();            // モード切替で作業カートは空に
  renderGrid();
};

/* ===== カート ===== */
function addToCart(id){
  if(!RETURN && availOf(id)<=0){ const p=prod(id); toast('在庫が足りません（残り'+(p?p.stock:0)+'）'); return; }
  cart[id]=(cart[id]||0)+1; renderCart();
}
function setQty(id,d){
  if(d>0 && !RETURN && availOf(id)<=0){ const p=prod(id); toast('在庫が足りません（残り'+(p?p.stock:0)+'）'); return; }
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  renderCart();
}
function delItem(id){ delete cart[id]; renderCart(); }
function clearCart(){ cart={}; renderCart(); }

/* 会計/返品後に在庫表示を最新化 */
async function refreshProducts(){
  try{ const r=await jsonp('getProducts'); if(r.ok){ PRODUCTS=r.products; renderGrid(); } }catch(e){}
}

function cartTotal(){
  return Object.keys(cart).reduce(function(s,id){
    const p=PRODUCTS.find(x=>x.id===id); return s+(p?p.price*cart[id]:0);
  },0);
}

function renderCart(){
  const box=document.getElementById('items');
  const ids=Object.keys(cart);
  if(!ids.length){
    box.innerHTML='<div class="empty"><b>商品をタップしてください</b>選ぶとここに入ります</div>';
  }else{
    box.innerHTML='';
    ids.forEach(function(id){
      const p=PRODUCTS.find(x=>x.id===id); if(!p)return;
      const q=cart[id], sub=p.price*q;
      const el=document.createElement('div'); el.className='item';
      el.innerHTML=
        '<span class="inm">'+esc(p.name)+'</span>'
       +'<span class="isum">'+yen(sub)+'</span>'
       +'<span class="isub">'+yen(p.price)+' × '+q+'</span>'
       +'<span class="qty">'
       +'  <button data-a="del" title="削除" class="del">✕</button>'
       +'  <button data-a="minus">−</button>'
       +'  <span class="n">'+q+'</span>'
       +'  <button data-a="plus">＋</button>'
       +'</span>';
      el.querySelector('[data-a=minus]').onclick=()=>setQty(id,-1);
      el.querySelector('[data-a=plus]').onclick=()=>setQty(id,1);
      el.querySelector('[data-a=del]').onclick=()=>delItem(id);
      box.appendChild(el);
    });
  }
  const total=cartTotal();
  document.getElementById('cartTotal').innerHTML='<small>¥</small>'+total.toLocaleString('ja-JP');
  const payBtn=document.getElementById('payBtn');
  payBtn.disabled=(ids.length===0);
  payBtn.textContent=RETURN?'返品する':'会計する';
  document.getElementById('cartTitle').textContent=RETURN?'返品カート':'カート';
  document.getElementById('clearBtn').style.display=ids.length?'block':'none';
}

document.getElementById('clearBtn').onclick=clearCart;

/* ===== 会計オーバーレイ ===== */
const overlay=document.getElementById('overlay');
document.getElementById('payBtn').onclick=openPay;
document.getElementById('cancelBtn').onclick=closePay;

function payTotal(){ const sub=cartTotal(); return sub-Math.min(discount,sub); }

function openPay(){
  if(!Object.keys(cart).length)return;
  received=0; discount=0;
  setDiscActive(0);
  document.getElementById('confirmBtn').textContent=RETURN?'返品を確定':'会計を確定';
  updatePay();
  overlay.classList.add('on');
}
function closePay(){ overlay.classList.remove('on'); }

function setDiscActive(v){
  overlay.querySelectorAll('.discbtns button').forEach(function(x){
    x.classList.toggle('on', x.dataset.disc===String(v));
  });
}

function updatePay(){
  const sub=cartTotal();
  if(RETURN){
    document.getElementById('ovRefund').textContent=yen(sub);
    document.getElementById('confirmBtn').disabled=(sub<=0);
    return;
  }
  const disc=Math.min(discount,sub);
  const total=sub-disc;
  const change=received-total;
  document.getElementById('ovSub').textContent=yen(sub);
  document.getElementById('ovDisc').textContent='−'+yen(disc);
  document.getElementById('ovTotal').textContent=yen(total);
  document.getElementById('ovRecv').textContent=yen(received);
  document.getElementById('ovChange').textContent=(received>0)?yen(change):'¥0';
  document.getElementById('ovChangeRow').classList.toggle('neg', received>0 && change<0);
  document.getElementById('confirmBtn').disabled=(received>0 && change<0);
}

/* 値引きボタン */
overlay.querySelector('.discbtns').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b)return;
  const sub=cartTotal();
  const v=b.dataset.disc;
  if(v==='round'){ const t=Math.floor(sub/100)*100; discount=(t>0)?(sub-t):0; }
  else{ discount=Math.min(Number(v),sub); }
  setDiscActive(v);
  if(received>0) received=payTotal();   // ちょうど入力後に値引きしたら追従
  updatePay();
});

overlay.querySelector('.quick').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.exact){ received=payTotal(); }
  else if(b.dataset.add){ received+=Number(b.dataset.add); }
  updatePay();
});
overlay.querySelector('.keys').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b)return;
  const k=b.dataset.k;
  if(k==='back'){ received=Math.floor(received/10); }
  else{ received=Number(String(received)+k); if(received>9999999)received=9999999; }
  updatePay();
});

/* ===== 会計確定 ===== */
document.getElementById('confirmBtn').onclick=async function(){
  const btn=this;
  const items=Object.keys(cart).map(id=>({id:id,qty:cart[id]}));
  if(!items.length)return;
  const labelBase=RETURN?'返品を確定':'会計を確定';
  btn.disabled=true; btn.textContent='送信中…';
  try{
    if(RETURN){
      const res=await jsonp('refund',{items:JSON.stringify(items)});
      if(!res.ok)throw new Error(res.error||'返品に失敗しました');
      closePay(); clearCart(); refreshSummary(); refreshProducts();
      toast('返品完了<br><span class="big">返金 '+yen(res.refund)+'</span>');
    }else{
      const sub=cartTotal();
      const disc=Math.min(discount,sub);
      const total=sub-disc;
      if(received>0 && received<total){ btn.disabled=false; btn.textContent=labelBase; return; }
      const res=await jsonp('checkout',{items:JSON.stringify(items),received:received||total,discount:disc});
      if(!res.ok)throw new Error(res.error||'会計に失敗しました');
      closePay(); clearCart(); refreshSummary(); refreshProducts();
      const chg=res.change||0;
      const dmsg=res.discount>0?('（値引 '+yen(res.discount)+'）'):'';
      toast('会計完了 '+yen(res.total)+dmsg+'<br><span class="big">お釣り '+yen(chg)+'</span>');
    }
  }catch(e){
    toast('⚠ '+e.message);
  }finally{
    btn.disabled=false; btn.textContent=labelBase;
  }
};

/* ===== 本日の売上 ===== */
async function refreshSummary(){
  try{
    const s=await jsonp('getSummary');
    if(s.ok){
      document.getElementById('todayAmt').textContent=yen(s.salesTotal);
      document.getElementById('todayCt').textContent=s.txCount+'件 / '+s.itemCount+'点';
    }
  }catch(e){/* 売上表示は失敗しても会計は継続 */}
}

/* ===== ユーティリティ ===== */
let toastTimer;
function toast(html){
  const t=document.getElementById('toast');
  t.innerHTML=html; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),3200);
}
function showBanner(msg){
  const b=document.getElementById('banner'); b.textContent=msg; b.classList.add('on');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
